<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đồ án 2 · Xe hai bánh tự cân bằng</title><link rel="manifest" href="/manifest.json"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon.svg"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BalanceBot"><link rel="stylesheet" href="/welcome.css"><script src="/qrcode.min.js"></script></head>
<body><main><section class="card"><div class="eyebrow">XE HAI BÁNH TỰ CÂN BẰNG · LQR + PID</div><h2 id="form-title">Đăng nhập</h2><p id="form-note">Đăng nhập để mở giao diện giám sát xe.</p><form id="auth-form" autocomplete="off"><label for="username">Tên tài khoản</label><input id="username" name="username" autocomplete="off" pattern="[A-Za-z0-9_]{3,32}" minlength="3" maxlength="32" required><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><div id="confirm-row" hidden><label for="confirm">Nhập lại mật khẩu</label><input id="confirm" type="password" autocomplete="new-password"></div><p id="message" role="status" aria-live="polite"></p><button id="submit" type="submit">Đăng nhập</button></form><button class="secondary" id="toggle">Chưa có tài khoản? Đăng ký</button><a id="dashboard-link" href="/" hidden>Vào bảng điều khiển →</a><p class="small">Tài khoản lưu trên máy chạy web. Đăng ký không cần email hay xác thực.</p>

<div id="phone-connect-box" class="phone-connect-box" hidden>
  <div class="phone-header"><span>📱 Mở trên điện thoại</span></div>
  <div id="qr-container" class="qr-container"></div>
  <div class="phone-link"><code id="phone-url-display"></code><button id="btn-copy-url" type="button" class="btn-copy" title="Sao chép liên kết">Sao chép</button></div>
  <p class="phone-hint">Cùng nối Wi-Fi nhà/AP xe rồi quét mã để mở ngay trên điện thoại.</p>
</div>
</section></main><script src="/welcome.js"></script></body></html>
