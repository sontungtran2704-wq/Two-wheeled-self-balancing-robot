<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Robot Body -->
  <rect x="226" y="90" width="60" height="240" rx="12" fill="url(#cyanGrad)" />
  <!-- Center electronics plate -->
  <rect x="206" y="140" width="100" height="130" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="6"/>
  <!-- Status LED / ESP32 core -->
  <circle cx="256" cy="190" r="18" fill="#38bdf8"/>
  <circle cx="256" cy="190" r="8" fill="#ffffff"/>
  
  <!-- Wheels & Axle -->
  <rect x="136" y="320" width="240" height="20" rx="10" fill="#94a3b8"/>
  <!-- Left Wheel -->
  <rect x="120" y="270" width="32" height="120" rx="16" fill="url(#wheelGrad)" stroke="#38bdf8" stroke-width="4"/>
  <!-- Right Wheel -->
  <rect x="360" y="270" width="32" height="120" rx="16" fill="url(#wheelGrad)" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- Balance Arc / Horizon indicators -->
  <path d="M160 430 A140 140 0 0 0 352 430" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8"/>
  <circle cx="256" cy="430" r="6" fill="#38bdf8"/>
</svg>

